version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: bhumisetu_postgis
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bhumisetu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bhumisetu_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-bhumisetu_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bhumisetu_user} -d ${POSTGRES_DB:-bhumisetu_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local

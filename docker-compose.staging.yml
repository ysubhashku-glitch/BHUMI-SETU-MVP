version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL 16 + PostGIS 3.4 Spatial Database
  # ============================================================================
  db:
    image: postgis/postgis:16-3.4
    container_name: bhumisetu_staging_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bhumisetu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided by the operator in .env or environment}
      POSTGRES_DB: ${POSTGRES_DB:-bhumisetu_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
      - ./backend/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bhumisetu_user} -d ${POSTGRES_DB:-bhumisetu_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bhumisetu_network

  # ============================================================================
  # 2. Redis 7 Cache & Task Broker
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: bhumisetu_staging_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - staging_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bhumisetu_network

  # ============================================================================
  # 3. MinIO S3-Compatible Object Storage Vault
  # ============================================================================
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: bhumisetu_staging_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be provided by the operator in .env or environment}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - staging_miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - bhumisetu_network

  # ============================================================================
  # 4. FastAPI Application Web Service
  # ============================================================================
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bhumisetu_staging_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ENVIRONMENT: staging
      DEBUG: "false"
      PROJECT_NAME: "BhumiSetu Land Intelligence Platform (Staging)"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,https://staging.bhumisetu.gov.in}"
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-bhumisetu_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided by the operator in .env or environment}@db:5432/${POSTGRES_DB:-bhumisetu_db}"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be provided by the operator and must be a cryptographically random secret of at least 32 characters}"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      ASYNC_PROCESSING: "true"
      STORAGE_ADAPTER: "minio"
      AWS_S3_BUCKET: "bhumisetu-staging-evidence-vault"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be provided by the operator in .env or environment}"
      S3_ENDPOINT_URL: "http://minio:9000"
      S3_USE_SSL: "false"
      PUBLIC_BASE_URL: "https://staging.bhumisetu.gov.in"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bhumisetu_network

  # ============================================================================
  # 5. Celery Worker (OCR & Report Generation)
  # ============================================================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bhumisetu_staging_worker
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "-Q", "default,ocr_queue,report_queue", "--concurrency=2"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ENVIRONMENT: staging
      DEBUG: "false"
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-bhumisetu_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided by the operator in .env or environment}@db:5432/${POSTGRES_DB:-bhumisetu_db}"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be provided by the operator and must be a cryptographically random secret of at least 32 characters}"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      ASYNC_PROCESSING: "true"
      STORAGE_ADAPTER: "minio"
      AWS_S3_BUCKET: "bhumisetu-staging-evidence-vault"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be provided by the operator in .env or environment}"
      S3_ENDPOINT_URL: "http://minio:9000"
      S3_USE_SSL: "false"
    networks:
      - bhumisetu_network

networks:
  bhumisetu_network:
    driver: bridge

volumes:
  staging_pgdata:
    driver: local
  staging_redisdata:
    driver: local
  staging_miniodata:
    driver: local

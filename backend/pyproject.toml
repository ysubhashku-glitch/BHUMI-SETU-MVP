[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "boto3>=1.43.118",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "fpdf2>=2.8.9",
    "geoalchemy2>=0.20.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pillow>=13.0.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-multipart>=0.0.32",
    "qrcode>=8.2",
    "redis>=8.1.0",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
